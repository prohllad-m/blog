<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>
<link href="/pagefind/pagefind-component-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-component-ui.js" type="module"></script>

<div
  id="search-wrapper"
  role="dialog"
  aria-modal="true"
  aria-label="{{ i18n "search.input_placeholder" }}"
  class="invisible fixed inset-0 flex h-screen w-screen cursor-default flex-col bg-neutral-500/50 p-4 backdrop-blur-sm dark:bg-neutral-900/50 sm:p-6 md:p-[10vh] lg:p-[12vh] z-500"
  data-url="{{ "" | relLangURL }}">
  <div
    id="search-modal"
    class="flex flex-col w-full max-w-3xl min-h-0 mx-auto border rounded-md shadow-lg top-20 border-neutral-200 bg-neutral dark:border-neutral-700 dark:bg-neutral-800 overflow-hidden">
    <header class="relative z-10 flex items-center justify-between flex-none px-2 py-2 border-b border-neutral-200 dark:border-neutral-700">
      <div class="flex items-center justify-center w-8 h-8 text-neutral-400">
        {{ partial "icon.html" "search" }}
      </div>
      <div class="flex-auto mx-2 text-sm text-neutral-500 dark:text-neutral-400">
        {{ i18n "search.input_placeholder" }}
      </div>
      <button
        id="close-search-button"
        class="flex items-center justify-center w-8 h-8 text-neutral-700 hover:text-primary-600 dark:text-neutral dark:hover:text-primary-400"
        title="{{ i18n "search.close_button_title" }}">
        {{ partial "icon.html" "xmark" }}
      </button>
    </header>
    <section class="flex-auto p-2 overflow-auto max-h-[60vh]">
      <!-- Pagefind Component UI: declarative <pagefind-ui /> usage -->
      <pagefind-ui></pagefind-ui>
      <!-- Default UI mount (initialized via JS) -->
      <div id="search"></div>
      <!-- Alternative: Component UI building blocks -->
      <pagefind-modal></pagefind-modal>
    </section>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', function () {
    // Default UI initialization
    if (window.PagefindUI) {
      new PagefindUI({ element: "#search", showSubResults: true, showImages: false });
    }
    // Bridge Blowfish header buttons (search-button / search-button-mobile / close-search-button / wrapper) to Pagefind modal
    var wrapper = document.getElementById("search-wrapper");
    var modal = document.getElementById("search-modal");
    var showButton = document.getElementById("search-button");
    var showButtonMobile = document.getElementById("search-button-mobile");
    var hideButton = document.getElementById("close-search-button");
    var pfModal = document.querySelector("pagefind-modal");
    var pfTrigger = document.querySelector("pagefind-modal-trigger");

    function displaySearch() {
      // Prefer Pagefind Component modal if available
      if (pfModal && typeof pfModal.open === "function") {
        pfModal.open();
        return;
      }
      if (wrapper) {
        wrapper.style.visibility = "visible";
        document.body.style.overflow = "hidden";
        // Focus Pagefind input inside
        var pfInput = document.querySelector("pagefind-ui input, #search input, pagefind-modal input, .pagefind-ui__search-input");
        if (pfInput) pfInput.focus();
      }
    }
    function hideSearch() {
      if (pfModal && pfModal.isOpen) {
        pfModal.close();
        return;
      }
      if (wrapper) {
        wrapper.style.visibility = "hidden";
        document.body.style.overflow = "visible";
      }
    }
    if (showButton) showButton.addEventListener("click", displaySearch);
    if (showButtonMobile) showButtonMobile.addEventListener("click", displaySearch);
    if (hideButton) hideButton.addEventListener("click", hideSearch);
    if (wrapper) wrapper.addEventListener("click", function (e) { if (e.target === wrapper) hideSearch(); });
    if (modal) modal.addEventListener("click", function (e) { e.stopPropagation(); });

    // Keyboard shortcuts: / , Ctrl+K / Cmd+K , Escape
    document.addEventListener("keydown", function (event) {
      var active = document.activeElement;
      var tag = active ? active.tagName : "";
      var isInput = tag === "INPUT" || tag === "TEXTAREA" || (active && active.isContentEditable);
      if (event.key === "/" && !isInput) {
        event.preventDefault();
        displaySearch();
      }
      if (event.key.toLowerCase() === "k" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        // Toggle
        if (pfModal && pfModal.isOpen) hideSearch();
        else if (wrapper && wrapper.style.visibility === "visible") hideSearch();
        else displaySearch();
      }
      if (event.key === "Escape") hideSearch();
    });
  });
</script>

<style>
  /* Pagefind UI theming to match Blowfish */
  :root {
    --pagefind-ui-primary: #3b82f6;
    --pagefind-ui-text: #1f2937;
    --pagefind-ui-background: #ffffff;
    --pagefind-ui-border: #e5e7eb;
    --pagefind-ui-tag: #f3f4f6;
    --pagefind-ui-border-width: 1px;
    --pagefind-ui-border-radius: 8px;
    --pagefind-ui-font: inherit;
    --pf-text: #1f2937;
    --pf-background: #ffffff;
    --pf-border: #e5e7eb;
  }
  .dark {
    --pagefind-ui-primary: #60a5fa;
    --pagefind-ui-text: #f3f4f6;
    --pagefind-ui-background: #262626;
    --pagefind-ui-border: #404040;
    --pagefind-ui-tag: #404040;
    --pf-text: #f3f4f6;
    --pf-background: #262626;
    --pf-border: #404040;
    --pf-hover: #333333;
  }
  #search .pagefind-ui__search-input,
  pagefind-ui::part(input) {
    border-radius: 0.5rem;
  }
</style>
